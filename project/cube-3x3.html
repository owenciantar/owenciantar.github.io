<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3×3 Puzzle Cube</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fcfcfc; user-select: none;
  }
  #panel h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  #panel .row { display: flex; gap: 8px; }
  #panel button {
    appearance: none; border: 1px solid rgba(20, 20, 19, 0.18); border-radius: 8px;
    background: rgba(255, 255, 255, 0.92); color: #1a1915;
    font: 500 12.5px/1 inherit; padding: 9px 12px; cursor: pointer;
  }
  #panel button:hover { background: #fff; border-color: rgba(20, 20, 19, 0.34); }
  #panel button:disabled { opacity: 0.45; cursor: default; }
  #panel p { margin: 0; max-width: 232px; font: 400 12px/1.55 inherit; color: #fcfcfc; }
  #panel kbd {
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(20, 20, 19, 0.07); border-radius: 4px; padding: 2px 4px;
  }
  #moves {
    font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #fcfcfc;
  }
</style>
</head>
<body>
<three-d-stage name="puzzle-cube-3x3"></three-d-stage>
<div id="panel">
  <h1>3×3 Puzzle Cube</h1>
  <div class="row">
    <button id="scramble">Scramble</button>
    <button id="reset">Reset</button>
  </div>
  <p>Drag across a face to turn that layer. Drag the background to orbit.
     Keys <kbd>U</kbd> <kbd>D</kbd> <kbd>L</kbd> <kbd>R</kbd> <kbd>F</kbd> <kbd>B</kbd>,
     hold <kbd>⇧</kbd> to reverse.</p>
  <div id="moves">Turns 0</div>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const S = 0.019;        // cubie edge (19 mm)
const GAP = 0.0004;
const PITCH = S + GAP;
const R = 0.0022;       // cubie corner radius

function roundedRectShape(w, h, r) {
  const x = -w / 2, y = -h / 2;
  const s = new THREE.Shape();
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Rounded box: rounded-rect profile + bevelled extrusion on both caps.
function roundedBoxGeometry(size, radius) {
  const b = radius;
  const g = new THREE.ExtrudeGeometry(roundedRectShape(size - 2 * b, size - 2 * b, radius - b * 0.5), {
    depth: size - 2 * b,
    bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelOffset: 0,
    bevelSegments: 5, curveSegments: 8
  });
  g.translate(0, 0, -(size - 2 * b) / 2);
  g.computeVertexNormals();
  return g;
}

const TILE = 0.0160, TILE_R = 0.0022;
function tileGeometry() {
  const g = new THREE.ExtrudeGeometry(roundedRectShape(TILE, TILE, TILE_R), {
    depth: 0.00022, bevelEnabled: true, bevelThickness: 0.0001, bevelSize: 0.0001,
    bevelOffset: 0, bevelSegments: 2, curveSegments: 8
  });
  g.computeVertexNormals();
  return g;
}

const plastic = (name, color, rough) => new THREE.MeshStandardMaterial({
  name, color: new THREE.Color(color), roughness: rough, metalness: 0.05
});

const bodyMat = plastic('plastic_black', '#1b1b1e', 0.42);
const faceMats = {
  up:    plastic('tile_white',  '#f4f3ef', 0.3),
  down:  plastic('tile_yellow', '#ffd400', 0.3),
  front: plastic('tile_red',    '#c8102e', 0.3),
  back:  plastic('tile_orange', '#ff5800', 0.3),
  right: plastic('tile_blue',   '#0051ba', 0.3),
  left:  plastic('tile_green',  '#009b48', 0.3)
};

const cubieGeo = roundedBoxGeometry(S, R);
const tileGeo = tileGeometry();
const OUT = S / 2 + 0.00006;

const FACES = {
  right: [[ OUT, 0, 0], [0,  Math.PI / 2, 0]],
  left:  [[-OUT, 0, 0], [0, -Math.PI / 2, 0]],
  up:    [[0,  OUT, 0], [-Math.PI / 2, 0, 0]],
  down:  [[0, -OUT, 0], [ Math.PI / 2, 0, 0]],
  front: [[0, 0,  OUT], [0, 0, 0]],
  back:  [[0, 0, -OUT], [0, Math.PI, 0]]
};

const cube = new THREE.Group();
cube.name = 'puzzle_cube_3x3';
const cubies = [];

for (let i = -1; i <= 1; i++) {
  for (let j = -1; j <= 1; j++) {
    for (let k = -1; k <= 1; k++) {
      if (i === 0 && j === 0 && k === 0) continue; // hidden core
      const cubie = new THREE.Group();
      cubie.name = `cubie_${i + 1}${j + 1}${k + 1}`;
      cubie.position.set(i * PITCH, j * PITCH, k * PITCH);
      cubie.userData.cell = new THREE.Vector3(i, j, k);
      cubie.userData.home = cubie.position.clone();

      const body = new THREE.Mesh(cubieGeo, bodyMat);
      body.name = `${cubie.name}_body`;
      body.castShadow = true;
      body.receiveShadow = true;
      cubie.add(body);

      const shown = [];
      if (i === 1) shown.push('right');
      if (i === -1) shown.push('left');
      if (j === 1) shown.push('up');
      if (j === -1) shown.push('down');
      if (k === 1) shown.push('front');
      if (k === -1) shown.push('back');

      for (const f of shown) {
        const [p, e] = FACES[f];
        const tile = new THREE.Mesh(tileGeo, faceMats[f]);
        tile.name = `${cubie.name}_tile_${f}`;
        tile.position.set(p[0], p[1], p[2]);
        tile.rotation.set(e[0], e[1], e[2]);
        cubie.add(tile);
      }
      cube.add(cubie);
      cubies.push(cubie);
    }
  }
}

cube.rotation.y = Math.PI / 9;
cube.updateMatrixWorld(true);
cube.position.y = -new THREE.Box3().setFromObject(cube).min.y;

stage.setObject(cube);

/* ---------- layer turning ---------- */

const AXES = ['x', 'y', 'z'];
const AXIS_VEC = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
const pivot = new THREE.Group();
pivot.name = 'turn_pivot';
cube.add(pivot);

let turning = false;
let gen = 0;
const queue = [];
let turnCount = 0;
const moveLabel = document.getElementById('moves');

function enqueue(axis, layer, dir, ms, count) {
  queue.push({ axis, layer, dir, ms: ms ?? 190, count: count !== false });
  if (!turning) runQueue();
}

function runQueue() {
  const move = queue.shift();
  if (!move) { turning = false; return; }
  turning = true;
  const g0 = gen;
  const { axis, layer, dir, ms, count } = move;
  const group = cubies.filter(c => c.userData.cell[axis] === layer);
  for (const c of group) pivot.attach(c);
  pivot.rotation.set(0, 0, 0);

  const target = dir * Math.PI / 2;
  const t0 = performance.now();
  const step = () => {
    if (gen !== g0) return;
    const p = Math.min(1, (performance.now() - t0) / ms);
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; // easeInOutCubic
    pivot.rotation[axis] = target * e;
    if (p < 1) { requestAnimationFrame(step); return; }
    pivot.rotation[axis] = target;
    pivot.updateMatrixWorld(true);
    const q = new THREE.Quaternion().setFromAxisAngle(AXIS_VEC[axis], target);
    for (const c of group) {
      cube.attach(c);
      c.userData.cell.applyQuaternion(q).round();
      // snap out accumulated float drift
      c.position.set(
        c.userData.cell.x * PITCH, c.userData.cell.y * PITCH, c.userData.cell.z * PITCH
      );
      c.quaternion.x = Math.round(c.quaternion.x * 1e4) / 1e4;
      c.quaternion.y = Math.round(c.quaternion.y * 1e4) / 1e4;
      c.quaternion.z = Math.round(c.quaternion.z * 1e4) / 1e4;
      c.quaternion.w = Math.round(c.quaternion.w * 1e4) / 1e4;
      c.quaternion.normalize();
    }
    pivot.rotation.set(0, 0, 0);
    if (count) {
      turnCount++;
      moveLabel.textContent = `turns ${turnCount}`;
    }
    runQueue();
  };
  requestAnimationFrame(step);
}

// named moves, in cube-local space
const MOVES = {
  U: ['y',  1, -1], D: ['y', -1,  1],
  R: ['x',  1, -1], L: ['x', -1,  1],
  F: ['z',  1, -1], B: ['z', -1,  1]
};

function move(name, prime, ms, count) {
  const m = MOVES[name];
  if (m) enqueue(m[0], m[1], prime ? -m[2] : m[2], ms, count);
}

/* ---------- drag to turn a layer ---------- */

const canvas = stage.shadowRoot.querySelector('canvas');
const raycaster = new THREE.Raycaster();
const drag = { active: false };

function ndc(ev) {
  const r = canvas.getBoundingClientRect();
  return new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1
  );
}

function snapAxis(v) { // nearest signed unit axis of a local-space vector
  const a = [Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)];
  const i = a.indexOf(Math.max(...a));
  const out = new THREE.Vector3();
  out.setComponent(i, Math.sign(v.getComponent(i)) || 1);
  return out;
}

// screen-space direction (px) of a cube-local axis vector
function screenDir(localVec) {
  const cam = stage._camera;
  const o = cube.localToWorld(new THREE.Vector3(0, 0, 0)).project(cam);
  const p = cube.localToWorld(localVec.clone().multiplyScalar(0.01)).project(cam);
  return new THREE.Vector2(p.x - o.x, -(p.y - o.y)).normalize();
}

canvas.addEventListener('pointerdown', ev => {
  if (ev.button !== 0 || turning) return;
  raycaster.setFromCamera(ndc(ev), stage._camera);
  const hit = raycaster.intersectObject(cube, true)[0];
  if (!hit) return;                        // background → let OrbitControls orbit
  ev.stopImmediatePropagation();           // cube → we own this drag, not OrbitControls
  const cubie = hit.object.parent;
  const worldN = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const localN = snapAxis(cube.worldToLocal(worldN.clone().add(cube.getWorldPosition(new THREE.Vector3()))));
  drag.active = true;
  drag.start = new THREE.Vector2(ev.clientX, ev.clientY);
  drag.cell = cubie.userData.cell.clone();
  drag.normal = localN;
  drag.tangents = AXES
    .filter(a => localN.getComponent(AXES.indexOf(a)) === 0)
    .flatMap(a => [AXIS_VEC[a].clone(), AXIS_VEC[a].clone().negate()]);
  canvas.setPointerCapture(ev.pointerId);
}, true);

canvas.addEventListener('pointermove', ev => {
  if (!drag.active) return;
  const d = new THREE.Vector2(ev.clientX - drag.start.x, ev.clientY - drag.start.y);
  if (d.length() < 9) return;
  const dir = d.clone().normalize();
  let best = null, bestDot = -Infinity;
  for (const t of drag.tangents) {
    const dot = screenDir(t).dot(dir);
    if (dot > bestDot) { bestDot = dot; best = t; }
  }
  drag.active = false;
  const axisVec = snapAxis(new THREE.Vector3().crossVectors(drag.normal, best));
  const axis = AXES[[0, 1, 2].find(i => axisVec.getComponent(i) !== 0)];
  const sign = axisVec.getComponent(AXES.indexOf(axis));
  enqueue(axis, drag.cell[axis], sign);
}, true);

canvas.addEventListener('pointerup', ev => {
  drag.active = false;
  if (canvas.hasPointerCapture(ev.pointerId)) canvas.releasePointerCapture(ev.pointerId);
}, true);

/* ---------- controls ---------- */

addEventListener('keydown', ev => {
  const k = ev.key.toUpperCase();
  if (MOVES[k]) { move(k, ev.shiftKey); ev.preventDefault(); }
});

document.getElementById('scramble').addEventListener('click', () => {
  const names = Object.keys(MOVES);
  let last = '';
  for (let n = 0; n < 22; n++) {
    let name;
    do { name = names[Math.floor(Math.random() * names.length)]; } while (name === last);
    last = name;
    move(name, Math.random() < 0.5, 110, false);
  }
  turnCount = 0;
  moveLabel.textContent = 'turns 0';
});

document.getElementById('reset').addEventListener('click', () => {
  gen++;
  turning = false;
  queue.length = 0;
  pivot.rotation.set(0, 0, 0);
  for (const c of cubies) {
    const i = Math.round(c.userData.home.x / PITCH),
          j = Math.round(c.userData.home.y / PITCH),
          k = Math.round(c.userData.home.z / PITCH);
    cube.attach(c);
    c.position.copy(c.userData.home);
    c.quaternion.identity();
    c.userData.cell.set(i, j, k);
  }
  turnCount = 0;
  moveLabel.textContent = 'turns 0';
});
</script>
</body>
</html>
